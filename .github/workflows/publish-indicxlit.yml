name: Publish IndicXlit model assets

on:
  workflow_dispatch:
  push:
    branches: [codex/indicxlit-roman-hindi]
    paths: [.github/workflows/publish-indicxlit.yml]

permissions:
  contents: write

concurrency:
  group: publish-indicxlit-v1
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-only export tools
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.17.0 onnxruntime==1.20.1
      - name: Download trusted original checkpoint
        run: |
          python - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          path = pathlib.Path('indicxlit.zip')
          urllib.request.urlretrieve('https://github.com/AI4Bharat/IndicXlit/releases/download/v1.0/indicxlit-indic-en-v1.0.zip', path)
          assert hashlib.sha256(path.read_bytes()).hexdigest() == '420d23a13cfa953edfb47644bc805de06e97134f25e6d182303a29f55b5a3322'
          with zipfile.ZipFile(path) as archive:
              archive.extractall('checkpoint')
          PY
      - name: Export and verify exact catalog bytes
        run: |
          python scripts/export_indicxlit.py checkpoint output
          python - <<'PY'
          import hashlib, json, pathlib
          models = json.loads(pathlib.Path('alter-voice/src/main/assets/alter_voice_models.json').read_text())['models']
          for spec in models:
              if spec['family'] != 'IndicXlit': continue
              data = (pathlib.Path('output') / spec['filename']).read_bytes()
              assert len(data) == spec['downloadBytes'], spec['filename']
              assert hashlib.sha256(data).hexdigest() == spec['sha256'], spec['filename']
          PY
      - name: Publish pinned model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(output/encoder.onnx output/decoder.onnx output/vocab.json licenses/IndicXlit-MIT.txt licenses/IndicXlit-PROVENANCE.md)
          if gh release view indicxlit-v1.0-onnx-1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload indicxlit-v1.0-onnx-1 "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create indicxlit-v1.0-onnx-1 "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --title 'IndicXlit v1.0 Android FP32 model assets' --notes-file licenses/IndicXlit-PROVENANCE.md
          fi
